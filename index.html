<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Aaron Fleshner is a lead Android engineer in Durham, NC, and a former Team USA diver.">
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
    <title>Aaron Fleshner, Lead Android Engineer</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference');
          if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
